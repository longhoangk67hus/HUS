<!DOCTYPE html>
<html lang="vi">
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Form</title>
        <style>
            .login-container {
                width: 500px;
                height: 300px;
                margin: 100px auto;
                border: 2px solid #6aa2d8;
                padding: 20px;
                text-align: left;
                font-family: 'Times New Roman', Times, serif, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
               
            }
            form {
                display: flex;
                flex-direction: column;
                align-items: center;
                
            }
            .login-row{
                margin-bottom: 15px;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                
            }
            .login-row label {
            display: inline-block;
            width: 150px;
            background-color: #6aa2d8;
            color: white;
            padding: 10px;
            font-weight: bold;
            
            margin-right: 10px;
            
        }
        .login-row input[type="text"], 
        .login-row input[type="password"] {
            width: 160px;
            padding: 10px;
            border: 2px solid #5a9cd6;
            border-color: #5a9cd6;
            color: black;
            background-color: #ffffff;
        }
        .login-container button {
            width: 30%;
            padding: 15px;
            background-color: #6aa2d8;
            color: white;
            border: none;
            font-size: 16px;
            margin: 20px auto 0 auto;
            cursor: pointer;
        }

        form {
            display: flex;
            flex-direction: column;
        }
            </style>
        </head>
<body>
    <!-- khung đăng nhập -->
    <div class="login-container">
        <form action="#" method="get">
            <div class="login-row">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username">
            </div>
            <div class="login-row">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit" style="display: flex; border-radius: 8px; justify-content: center; text-align: center;">Đăng nhập</button>
        </form>
    </div>
        <!-- Tiêu đề bảng -->
        <table style="border: 1px solid black; border-style: double;" >
        <thead>
            <th  style="width: 100px ;color: green; border: 1px solid black; border-style: double;">STT</th>
            <th  style="width: 1000px;color: green; border: 1px solid black; border-style: double;"> Sinh viên</th>
            <th  style="width: 600px;color:  green; border: 1px solid black; border-style: double;">Ngày sinh</th>
            <th  style="width: 200px;color: green; border: 1px solid black; border-style: double;">Môn học</th>
            <th  style="width: 250px;color: green; border: 1px solid black; border-style: double;">Khoá</th>
        </thead>

        <body>

                <td  style="color: blue; border: 1px solid black; border-style: double;"> 1</td>

                <td style="color: blue; border: 1px solid black; border-style: double;">12/12/2002</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">LT Web</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">K66</td>
            </tr>
            <tr>
                <td style="color: blue; border: 1px solid black; border-style: double;">2</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">Nguyễn Văn B</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">12/06/2002</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">LT Web</td>
                <td style="color: blue; border: 1px solid black; border-style: double;">K66</td>
            </tr>
        </body>
    </table>


</body>

</html>
